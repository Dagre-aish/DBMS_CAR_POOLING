{% extends 'base.html' %}
{% block title %}Login • CabShare{% endblock %}
{% block content %}
<div class="max-w-md mx-auto my-10">
  <div class="bg-slate-800/80 border border-slate-700 rounded-3xl p-8 shadow-xl">
    <div class="text-center mb-6">
      <div class="w-14 h-14 mx-auto rounded-2xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-2xl">
        <i class="fa-solid fa-right-to-bracket"></i>
      </div>
      <h1 class="text-2xl font-black text-white mt-4">Welcome Back</h1>
      <p class="text-sm text-slate-400 mt-1">Login to your CabShare account.</p>
    </div>
    <form method="POST" class="space-y-4">
      <div>
        <label class="text-xs text-slate-300">Phone Number</label>
        <input type="tel" name="phone_number" required autocomplete="tel" class="w-full mt-1 px-4 py-3 rounded-xl bg-slate-900 border border-slate-700 text-white" placeholder="Enter phone number">
      </div>
      <div>
        <label class="text-xs text-slate-300">Password</label>
        <input type="password" name="password" required autocomplete="current-password" class="w-full mt-1 px-4 py-3 rounded-xl bg-slate-900 border border-slate-700 text-white" placeholder="Enter password">
      </div>
      <button type="submit" class="w-full py-3 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold">Login</button>
    </form>
    <p class="text-center text-sm text-slate-400 mt-5">
      Don't have an account?
      <a href="{{ url_for('register') }}" class="text-emerald-400 font-semibold">Create one</a>
    </p>
  </div>
</div>
{% endblock %}
