{% extends 'base.html' %}

{% block title %}Sign Up • CabShare{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-6 space-y-6">

    <!-- Card Header -->
    <div class="text-center space-y-2">
        <div class="w-12 h-12 rounded-2xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center mx-auto text-2xl shadow-lg shadow-emerald-500/10">
            <i class="fa-solid fa-user-plus"></i>
        </div>
        <h1 class="text-2xl font-black text-white">Create Commuter Account</h1>
        <p class="text-xs text-slate-400">Join CabShare to split cab fares and save daily travel money</p>
    </div>

    <!-- Registration Form -->
    <form method="POST" action="{{ url_for('register') }}" class="bg-slate-800/90 border border-slate-700/80 rounded-3xl p-6 sm:p-8 shadow-2xl space-y-4">
        
        <!-- Full Name -->
        <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1.5">Full Name *</label>
            <div class="relative">
                <i class="fa-solid fa-user absolute left-3.5 top-3 text-slate-400 text-xs"></i>
                <input type="text" name="name" required placeholder="e.g. Aishwarya"
                       class="w-full pl-9 pr-3 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500">
            </div>
        </div>

        <!-- Phone Number -->
        <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1.5">Phone Number (Login ID) *</label>
            <div class="relative">
                <i class="fa-solid fa-phone absolute left-3.5 top-3 text-slate-400 text-xs"></i>
                <input type="tel" name="phone_number" required placeholder="e.g. 9876543210"
                       class="w-full pl-9 pr-3 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500">
            </div>
        </div>

        <!-- Gender -->
        <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1.5">Gender *</label>
            <select name="gender" required class="w-full px-3 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white focus:outline-none focus:border-emerald-500">
                <option value="Female">Female</option>
                <option value="Male">Male</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <!-- Password -->
        <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1.5">Create Password *</label>
            <div class="relative">
                <i class="fa-solid fa-lock absolute left-3.5 top-3 text-slate-400 text-xs"></i>
                <input type="password" name="password" required placeholder="••••••••"
                       class="w-full pl-9 pr-3 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500">
            </div>
        </div>

        <!-- Submit Button -->
        <div class="pt-2">
            <button type="submit" class="w-full py-3 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold rounded-xl text-xs shadow-lg shadow-emerald-500/25 transition">
                <i class="fa-solid fa-check-circle mr-1.5"></i>Create Account & Start Sharing
            </button>
        </div>

        <!-- Login Link -->
        <div class="text-center pt-2 border-t border-slate-700/60 text-xs text-slate-400">
            Already registered? <a href="{{ url_for('login') }}" class="text-emerald-400 hover:text-emerald-300 font-semibold">Log In here &rarr;</a>
        </div>

    </form>

</div>
{% endblock %}
